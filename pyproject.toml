[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-research-agent"
version = "1.0.0"
description = "A production-grade autonomous AI research system using Google Gemini, LangGraph, and specialized agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AI/ML Engineering Team" }
]
dependencies = [
    "google-genai>=2.20.0",
    "langgraph>=1.2.0",
    "langchain-core>=1.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
